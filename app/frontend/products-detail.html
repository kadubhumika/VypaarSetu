<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - VyapaarSetu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-white text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-100 px-4 lg:px-16 h-16 flex items-center justify-between gap-4">
        <div class="flex items-center gap-8 flex-shrink-0">
            <a href="customer-dashboard.html" class="text-xl font-black text-[#009640] tracking-tight">VyapaarSetu</a>
        </div>
        <div class="flex items-center gap-6 text-xs font-bold text-gray-700 flex-shrink-0">
            <a href="add-to-cart.html" class="relative p-1 text-gray-700 hover:text-gray-900 transition">
                <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-[#009640] text-white text-[9px] font-black rounded-full flex items-center justify-center">0</span>
            </a>
        </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto w-full px-4 lg:px-8 py-4 space-y-10">
        <nav class="text-[10px] font-semibold text-gray-400 flex items-center gap-1.5 uppercase tracking-wider">
            <a href="customer-dashboard.html" class="hover:text-gray-600">Home</a>
            <span class="text-gray-300">/</span>
            <span id="breadcrumb-category" class="text-gray-800 font-bold">Product</span>
        </nav>

        <section class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            <div class="space-y-4">
                <div class="aspect-4/3 bg-[#f8f9fa] rounded-2xl overflow-hidden flex items-center justify-center p-8 border border-gray-100 text-gray-300">
                    <i data-lucide="package" class="w-24 h-24"></i>
                </div>
            </div>

            <div class="space-y-6 lg:pl-4">
                <div class="space-y-2">
                    <h1 id="product-name" class="text-2xl font-extrabold text-gray-900 tracking-tight leading-tight">Loading...</h1>
                    <p id="store-name" class="text-xs font-semibold text-gray-500">at —</p>
                </div>

                <div class="space-y-0.5">
                    <span id="product-price" class="text-3xl font-black text-gray-900 tracking-tight">₹0</span>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide block">Inclusive of all taxes</span>
                </div>

                <div class="space-y-2">
                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-gray-400 block">Quantity</span>
                    <div class="flex items-center border border-gray-200 rounded-xl w-24 justify-between p-1 bg-white">
                        <button id="qty-minus" class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-gray-700 transition text-sm">-</button>
                        <span id="qty-display" class="text-xs font-bold text-gray-800">1</span>
                        <button id="qty-plus" class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-gray-700 transition text-sm">+</button>
                    </div>
                </div>

                <div class="bg-[#f0f4fd] rounded-xl p-4 space-y-2.5 text-xs font-medium text-gray-600 border border-blue-50/50">
                    <div class="flex items-center gap-2 text-emerald-600 font-bold">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i>
                        <span id="stock-label">Checking stock...</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button id="add-to-cart-btn" class="bg-[#009640] hover:bg-[#007a33] text-white text-xs font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-xs">
                        <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                        <span>Add to Cart</span>
                    </button>
                    <button id="buy-now-btn" class="bg-[#111827] hover:bg-black text-white text-xs font-bold py-3.5 px-4 rounded-xl transition shadow-xs">
                        Buy Now
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script>
        lucide.createIcons();

        // Product data arrives via URL params — set when navigating here from a
        // search results / trending list, e.g.
        // products-detail.html?product_id=1&name=Rice&price=550&store_id=1&store_name=Ramesh+Kirana&qty_available=18
        const params = new URLSearchParams(window.location.search);
        const product = {
            product_id: Number(params.get("product_id")),
            product_name: params.get("name") || "Unknown product",
            selling_price: Number(params.get("price")) || 0,
            store_id: Number(params.get("store_id")),
            store_name: params.get("store_name") || "Unknown store",
            quantity_available: Number(params.get("qty_available")) || 0,
        };

        let selectedQty = 1;

        function render() {
            document.getElementById("product-name").textContent = product.product_name;
            document.getElementById("store-name").textContent = `at ${product.store_name}`;
            document.getElementById("product-price").textContent = `₹${product.selling_price.toLocaleString("en-IN")}`;
            document.getElementById("breadcrumb-category").textContent = product.product_name;
            document.getElementById("stock-label").textContent = product.quantity_available > 0
                ? `In Stock (${product.quantity_available} available)`
                : "Out of Stock";
            document.getElementById("qty-display").textContent = selectedQty;
            updateCartBadge();

            const outOfStock = product.quantity_available <= 0;
            document.getElementById("add-to-cart-btn").disabled = outOfStock;
            document.getElementById("buy-now-btn").disabled = outOfStock;
            if (outOfStock) {
                document.getElementById("add-to-cart-btn").classList.add("opacity-50", "cursor-not-allowed");
                document.getElementById("buy-now-btn").classList.add("opacity-50", "cursor-not-allowed");
            }
        }

        function updateCartBadge() {
            document.getElementById("cart-badge").textContent = cartCount();
        }

        document.getElementById("qty-minus").addEventListener("click", () => {
            selectedQty = Math.max(1, selectedQty - 1);
            document.getElementById("qty-display").textContent = selectedQty;
        });
        document.getElementById("qty-plus").addEventListener("click", () => {
            selectedQty = Math.min(product.quantity_available, selectedQty + 1);
            document.getElementById("qty-display").textContent = selectedQty;
        });

        document.getElementById("add-to-cart-btn").addEventListener("click", () => {
            for (let i = 0; i < selectedQty; i++) addToCart(product);
            updateCartBadge();
            alert("Added to cart!");
        });

        document.getElementById("buy-now-btn").addEventListener("click", () => {
            addToCart(product);
            window.location.href = "add-to-cart.html";
        });

        render();
    </script>
</body>
</html>
