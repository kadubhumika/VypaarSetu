<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VyapaarSetu - Customer Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-white min-h-screen flex text-gray-800 antialiased">

    <div class="hidden md:flex md:w-1/2 bg-cover bg-center relative p-12 flex-col justify-center items-center"
         style="background-image: url('https://images.unsplash.com/photo-1533900298318-6b8da08a523e?auto=format&fit=crop&q=80&w=1000');">
        <div class="absolute inset-0 bg-black/40"></div>
        <div class="relative z-10 text-white max-w-md">
            <h1 class="text-3xl font-bold mb-4 leading-tight">Discover Local Commerce</h1>
            <p class="text-white/90 text-sm leading-relaxed">Search for products from stores near you — no password needed, just your email.</p>
        </div>
    </div>

    <div class="w-full md:w-1/2 flex flex-col justify-center p-8 md:p-12 min-h-screen bg-white">
        <div class="w-full max-w-md mx-auto flex flex-col items-center">
            <div class="bg-[#009640] text-white p-3.5 rounded-xl shadow-sm mb-4"><i data-lucide="shopping-bag" class="w-7 h-7"></i></div>
            <h2 class="text-2xl font-bold text-[#00642d] tracking-tight">VyapaarSetu</h2>
            <p class="text-xs text-gray-500 mt-1 mb-8 font-medium">Customer Login — Email OTP</p>

            <div id="error-banner" class="hidden w-full bg-red-50 border border-red-200 text-red-700 text-xs font-semibold rounded-lg px-4 py-3 mb-4"></div>
            <div id="info-banner" class="hidden w-full bg-blue-50 border border-blue-200 text-blue-700 text-xs font-semibold rounded-lg px-4 py-3 mb-4"></div>

            <!-- Step 1: enter email -->
            <form id="email-form" class="w-full space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 uppercase tracking-wider mb-1.5">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"><i data-lucide="mail" class="w-4 h-4"></i></div>
                        <input id="email" type="email" placeholder="you@example.com" required
                               class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm placeholder-gray-400 focus:outline-none focus:border-[#009640] focus:ring-1 focus:ring-[#009640] transition">
                    </div>
                </div>
                <button type="submit" id="send-otp-btn"
                        class="w-full bg-[#12a64a] hover:bg-[#0e8f3e] text-white font-semibold py-3 px-4 rounded-lg text-sm shadow-sm flex items-center justify-center gap-1.5 transition">
                    <span id="send-otp-label">Send OTP</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Step 2: enter OTP (hidden until email submitted) -->
            <form id="otp-form" class="hidden w-full space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 uppercase tracking-wider mb-1.5">Enter the 6-digit code</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"><i data-lucide="key-round" class="w-4 h-4"></i></div>
                        <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="123456" required
                               class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm placeholder-gray-400 focus:outline-none focus:border-[#009640] focus:ring-1 focus:ring-[#009640] transition tracking-widest">
                    </div>
                </div>
                <button type="submit" id="verify-otp-btn"
                        class="w-full bg-[#12a64a] hover:bg-[#0e8f3e] text-white font-semibold py-3 px-4 rounded-lg text-sm shadow-sm flex items-center justify-center gap-1.5 transition">
                    <span id="verify-otp-label">Verify & Continue</span>
                    <i data-lucide="check" class="w-4 h-4"></i>
                </button>
                <button type="button" id="back-to-email-btn" class="w-full text-xs font-bold text-gray-500 hover:text-gray-700 transition">
                    ← Use a different email
                </button>
            </form>

            <p class="text-xs text-gray-600 font-medium mt-6">
                Are you a merchant? <a href="login.html" class="text-[#008037] font-bold hover:underline">Merchant Login here</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        lucide.createIcons();

        if (getToken() && getRole() === "customer") {
            window.location.href = "customer-dashboard.html";
        }

        const errorBanner = document.getElementById("error-banner");
        const infoBanner = document.getElementById("info-banner");
        let currentEmail = "";

        function showError(msg) {
            infoBanner.classList.add("hidden");
            errorBanner.textContent = msg;
            errorBanner.classList.remove("hidden");
        }
        function showInfo(msg) {
            errorBanner.classList.add("hidden");
            infoBanner.textContent = msg;
            infoBanner.classList.remove("hidden");
        }

        document.getElementById("email-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("send-otp-btn");
            const label = document.getElementById("send-otp-label");
            btn.disabled = true;
            label.textContent = "Sending...";

            currentEmail = document.getElementById("email").value.trim();

            try {
                await apiFetch("/customer/auth/request-otp", { method: "POST", auth: false, body: { email: currentEmail } });
                document.getElementById("email-form").classList.add("hidden");
                document.getElementById("otp-form").classList.remove("hidden");
                showInfo(`OTP sent to ${currentEmail}. If email isn't configured on the backend yet, check the Docker logs for the code instead (look for "[DEV] OTP for...").`);
                document.getElementById("otp").focus();
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                label.textContent = "Send OTP";
            }
        });

        document.getElementById("otp-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("verify-otp-btn");
            const label = document.getElementById("verify-otp-label");
            btn.disabled = true;
            label.textContent = "Verifying...";

            const otp = document.getElementById("otp").value.trim();

            try {
                const data = await apiFetch("/customer/auth/verify-otp", { method: "POST", auth: false, body: { email: currentEmail, otp } });
                saveSession(data.access_token, "customer");
                window.location.href = "customer-dashboard.html";
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                label.textContent = "Verify & Continue";
            }
        });

        document.getElementById("back-to-email-btn").addEventListener("click", () => {
            document.getElementById("otp-form").classList.add("hidden");
            document.getElementById("email-form").classList.remove("hidden");
            errorBanner.classList.add("hidden");
            infoBanner.classList.add("hidden");
        });
    </script>
</body>
</html>
