<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart - VyapaarSetu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f8f9fa] text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 px-4 lg:px-16 h-16 flex items-center justify-between gap-4">
        <a href="customer-dashboard.html" class="text-2xl font-bold text-[#006b2b] tracking-tight">VyapaarSetu</a>
        <div class="flex items-center gap-6 text-xs font-semibold text-gray-600 ml-auto flex-shrink-0">
            <button id="logout-btn" class="hover:text-red-600 transition">Logout</button>
        </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto w-full px-4 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
            <div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">Your Shopping Cart</h1>
                <p id="item-count-label" class="text-xs text-gray-500 font-medium mt-0.5">0 items in your cart.</p>
            </div>
            <div id="cart-items" class="space-y-4">
                <p class="text-xs text-gray-400">Loading cart...</p>
            </div>
        </div>

        <div class="space-y-4">
            <div class="bg-white border border-gray-200 rounded-2xl p-5 space-y-4 shadow-xs">
                <h2 class="text-[10px] font-extrabold text-gray-400 uppercase tracking-wider">Price Details</h2>
                <div class="space-y-2.5 text-xs font-medium text-gray-600">
                    <div class="flex justify-between">
                        <span>Subtotal</span>
                        <span id="subtotal" class="text-gray-900">₹0</span>
                    </div>
                </div>
                <div class="border-t border-dashed border-gray-200 pt-3 flex justify-between items-center">
                    <span class="text-sm font-bold text-gray-900">Total Amount</span>
                    <span id="total-amount" class="text-xl font-black text-gray-900">₹0</span>
                </div>
                <button id="checkout-btn" class="w-full bg-[#006b2b] hover:bg-[#005422] text-white text-xs font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-1.5 transition shadow-sm group">
                    <span>PROCEED TO CHECKOUT</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script>
        lucide.createIcons();
        requireAuth("customer", "login.html");

        document.getElementById("logout-btn").addEventListener("click", () => { clearSession(); window.location.href = "login.html"; });

        function render() {
            const cart = getCart();
            document.getElementById("item-count-label").textContent = `${cartCount()} item(s) in your cart.`;

            document.getElementById("cart-items").innerHTML = cart.length ? cart.map(item => `
                <div class="bg-white border border-gray-200 rounded-xl p-4 flex gap-4 relative shadow-xs">
                    <div class="w-24 h-20 bg-gray-50 rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center text-gray-300">
                        <i data-lucide="package" class="w-8 h-8"></i>
                    </div>
                    <div class="flex-1 min-w-0 pr-8">
                        <h3 class="text-sm font-bold text-gray-900 truncate">${item.product_name}</h3>
                        <p class="text-[11px] text-gray-400 font-medium mt-0.5">${item.store_name}</p>
                        <div class="flex items-center border border-gray-200 rounded-lg w-24 justify-between p-1 mt-4">
                            <button class="qty-minus-btn w-6 h-6 flex items-center justify-center text-gray-400 hover:text-gray-600 transition text-sm" data-id="${item.product_id}">-</button>
                            <span class="text-xs font-bold text-gray-700">${item.quantity}</span>
                            <button class="qty-plus-btn w-6 h-6 flex items-center justify-center text-gray-400 hover:text-gray-600 transition text-sm" data-id="${item.product_id}">+</button>
                        </div>
                    </div>
                    <div class="text-right flex flex-col justify-between items-end">
                        <button class="remove-btn text-gray-400 hover:text-red-500 transition" data-id="${item.product_id}">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                        <span class="text-sm font-extrabold text-gray-900">₹${(item.selling_price * item.quantity).toLocaleString("en-IN")}</span>
                    </div>
                </div>
            `).join("") : `<p class="text-xs text-gray-400">Your cart is empty. <a href="customer-dashboard.html" class="text-[#009640] underline">Continue shopping</a>.</p>`;

            const total = cartTotal();
            document.getElementById("subtotal").textContent = `₹${total.toLocaleString("en-IN")}`;
            document.getElementById("total-amount").textContent = `₹${total.toLocaleString("en-IN")}`;
            document.getElementById("checkout-btn").disabled = cart.length === 0;

            lucide.createIcons();
            document.querySelectorAll(".qty-minus-btn").forEach(b => b.addEventListener("click", () => { updateCartQuantity(Number(b.dataset.id), -1); render(); }));
            document.querySelectorAll(".qty-plus-btn").forEach(b => b.addEventListener("click", () => { updateCartQuantity(Number(b.dataset.id), 1); render(); }));
            document.querySelectorAll(".remove-btn").forEach(b => b.addEventListener("click", () => { removeFromCart(Number(b.dataset.id)); render(); }));
        }

        document.getElementById("checkout-btn").addEventListener("click", async () => {
            const cart = getCart();
            if (!cart.length) return;

            // All cart items must be from the same store since /orders is store-scoped —
            // real multi-vendor carts would need one order per store; kept single-store here.
            const storeId = cart[0].store_id;
            if (cart.some(i => i.store_id !== storeId)) {
                alert("Items from multiple stores in one cart aren't supported yet — checkout one store's items at a time.");
                return;
            }

            try {
                const order = await apiFetch("/orders", {
                    method: "POST",
                    body: {
                        store_id: storeId,
                        items: cart.map(i => ({ product_id: i.product_id, quantity: i.quantity })),
                    },
                });
                clearCart();
                window.location.href = `checkout-payment.html?order_id=${order.id}`;
            } catch (err) {
                alert("Checkout failed: " + err.message);
            }
        });

        render();
    </script>
</body>
</html>
