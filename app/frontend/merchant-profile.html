<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - VyapaarSetu Merchant Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f8f9fa] text-gray-800 antialiased min-h-screen flex">

    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between p-4 sticky top-0 h-screen flex-shrink-0">
        <div class="space-y-8">
            <div class="px-2 py-1">
                <span class="text-xl font-black text-[#009640] tracking-tight block">VyapaarSetu</span>
                <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider block mt-0.5">Merchant Hub</span>
            </div>
            <nav class="space-y-1">
                <a href="merchant-dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-bold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4 text-gray-400"></i><span>Dashboard</span>
                </a>
                <a href="check-inventory.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-bold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">
                    <i data-lucide="boxes" class="w-4 h-4 text-gray-400"></i><span>Inventory</span>
                </a>
                <a href="order-status.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-bold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">
                    <i data-lucide="scroll-text" class="w-4 h-4 text-gray-400"></i><span>Orders</span>
                </a>
                <div class="h-[1px] bg-gray-100 my-4"></div>
                <a href="merchant-profile.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-bold bg-[#009640] text-white shadow-xs transition">
                    <i data-lucide="settings" class="w-4 h-4"></i><span>Settings</span>
                </a>
            </nav>
        </div>
        <div class="space-y-4 pt-4 border-t border-gray-100">
            <button id="logout-btn" class="w-full bg-white border border-red-200 text-red-600 text-xs font-bold py-2.5 px-4 rounded-xl transition">Logout</button>
        </div>
    </aside>

    <div class="flex-1 min-w-0 flex flex-col">
        <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between sticky top-0 z-10">
            <div>
                <h1 class="text-lg font-bold text-gray-900 tracking-tight">Profile Settings</h1>
                <p class="text-xs text-gray-400 font-medium mt-0.5">Update your store information and business details.</p>
            </div>
            <button id="save-btn" class="bg-[#009640] hover:bg-[#007a33] text-white text-xs font-bold px-4 py-2 rounded-xl shadow-xs transition">Save Changes</button>
        </header>

        <main class="p-8 max-w-5xl w-full mx-auto space-y-6">
            <div id="error-banner" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs font-semibold rounded-lg px-4 py-3"></div>

            <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-xs">
                <h3 class="text-xs font-bold text-gray-900 mb-5 tracking-tight">Primary Details</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-[11px] font-bold text-gray-400">Store Name</label>
                        <input id="store-name" type="text"
                               class="w-full border border-gray-200 rounded-xl px-3 py-2 text-xs font-medium text-gray-800 bg-[#fafafa] focus:outline-none focus:bg-white focus:border-[#009640] transition">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[11px] font-bold text-gray-400">GST Number</label>
                        <input id="gst-number" type="text"
                               class="w-full border border-gray-200 rounded-xl px-3 py-2 text-xs font-medium text-gray-800 bg-[#fafafa] focus:outline-none focus:bg-white focus:border-[#009640] transition">
                    </div>
                </div>
            </div>

            <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-xs space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-gray-900 tracking-tight">Business Address</h3>
                    <button id="use-gps-btn" class="text-[10px] font-bold text-[#009640] flex items-center gap-1 hover:underline">
                        <i data-lucide="locate-fixed" class="w-3.5 h-3.5"></i> Use GPS
                    </button>
                </div>
                <textarea id="store-address" rows="2" class="w-full border border-gray-200 rounded-xl p-3 bg-white text-xs font-medium text-gray-700"></textarea>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 block mb-1">Latitude</label>
                        <input id="store-lat" type="number" step="0.000001" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 block mb-1">Longitude</label>
                        <input id="store-lng" type="number" step="0.000001" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs">
                    </div>
                </div>
                <p class="text-[10px] text-gray-400">📍 Accurate coordinates are what let customers find you in "Nearby Stores" — click Use GPS or enter manually.</p>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        lucide.createIcons();
        requireAuth("merchant", "login.html");
        document.getElementById("logout-btn").addEventListener("click", () => { clearSession(); window.location.href = "login.html"; });

        const errorBanner = document.getElementById("error-banner");

        async function loadStore() {
            try {
                const store = await apiFetch("/stores/me");
                document.getElementById("store-name").value = store.store_name;
                document.getElementById("store-address").value = store.address;
                document.getElementById("store-lat").value = store.latitude;
                document.getElementById("store-lng").value = store.longitude;
            } catch (err) {
                errorBanner.textContent = err.message.includes("Create a store")
                    ? "You haven't created a store yet — go to Signup flow or create one via the API first."
                    : err.message;
                errorBanner.classList.remove("hidden");
            }
        }

        document.getElementById("use-gps-btn").addEventListener("click", () => {
            if (!navigator.geolocation) return alert("Geolocation not supported by this browser.");
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    document.getElementById("store-lat").value = pos.coords.latitude;
                    document.getElementById("store-lng").value = pos.coords.longitude;
                },
                () => alert("Couldn't get your location — check browser permissions.")
            );
        });

        document.getElementById("save-btn").addEventListener("click", async () => {
            try {
                await apiFetch("/stores/me", {
                    method: "PATCH",
                    body: {
                        store_name: document.getElementById("store-name").value,
                        address: document.getElementById("store-address").value,
                        latitude: Number(document.getElementById("store-lat").value),
                        longitude: Number(document.getElementById("store-lng").value),
                        gst_number: document.getElementById("gst-number").value || null,
                    },
                });
                alert("Store details saved!");
                errorBanner.classList.add("hidden");
            } catch (err) {
                errorBanner.textContent = err.message;
                errorBanner.classList.remove("hidden");
            }
        });

        loadStore();
    </script>
</body>
</html>
