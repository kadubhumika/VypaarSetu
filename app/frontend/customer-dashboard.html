<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VyapaarSetu - Discover Local Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-white text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-100 sticky top-0 z-50 px-4 lg:px-16 h-20 flex items-center justify-between gap-4">
        <span class="text-xl font-black text-[#009640] tracking-tight">VyapaarSetu</span>

        <div class="max-w-xl w-full relative hidden md:block">
            <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-4 top-1/2 transform -translate-y-1/2"></i>
            <input id="search-input" type="text" placeholder="Search products, e.g. Maggi, Rice, Oil..."
                   class="w-full pl-11 pr-4 py-2.5 bg-[#f1f4f9] rounded-lg text-xs font-medium placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-[#009640] transition">
        </div>

        <div class="flex items-center gap-6 text-xs font-bold text-gray-700 ml-auto md:ml-0 flex-shrink-0">
            <div class="flex items-center gap-1.5 text-gray-500">
                <i data-lucide="map-pin" class="w-4 h-4 text-[#009640]"></i>
                <div class="text-left leading-tight font-medium">
                    <span class="text-[9px] uppercase tracking-wider text-gray-400 block font-bold">Location</span>
                    <span id="location-label" class="text-gray-800 font-bold">Detecting...</span>
                </div>
            </div>
            <a href="add-to-cart.html" class="relative p-1.5 text-gray-700 hover:text-gray-900 transition">
                <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                <span id="cart-badge" class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-[#009640] text-white text-[9px] font-black rounded-full flex items-center justify-center">0</span>
            </a>
            <a href="customer-profile.html" class="w-8 h-8 rounded-full border border-gray-200 overflow-hidden cursor-pointer flex items-center justify-center bg-gray-100 text-gray-400">
                <i data-lucide="user" class="w-4 h-4"></i>
            </a>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full px-4 lg:px-8 py-6 space-y-10">

        <section id="search-results-section" class="hidden space-y-4">
            <h3 class="text-base font-bold text-gray-900 tracking-tight">
                Search results for "<span id="search-query-label"></span>" — nearest stores first
            </h3>
            <div id="search-results" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </section>

        <section id="nearby-section" class="space-y-4">
            <div class="flex justify-between items-baseline">
                <h3 class="text-base font-bold text-gray-900 tracking-tight">Nearby Stores Delivering Now</h3>
            </div>
            <div id="nearby-stores" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <p class="text-xs text-gray-400 col-span-3">Detecting your location to find nearby stores...</p>
            </div>
            <div id="map-container" class="hidden w-full h-72 rounded-2xl overflow-hidden border border-gray-200 mt-4"></div>
        </section>

    </main>

    <footer class="bg-[#f0f4fd] border-t border-gray-200 pt-6 pb-6 text-xs text-gray-500 font-medium mt-12">
        <div class="max-w-7xl mx-auto px-4 lg:px-8 text-center text-[11px]">
            © 2026 VyapaarSetu Technologies. All rights reserved. Built for India.
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/maps-config.js"></script>
    <script>
        lucide.createIcons();
        document.getElementById("cart-badge").textContent = cartCount();

        let userLat = null, userLng = null;
        let map = null;
        const locationLabel = document.getElementById("location-label");

        function loadGoogleMapsScript(callback) {
            if (!GOOGLE_MAPS_API_KEY) return;
            const script = document.createElement("script");
            script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=__initMap`;
            window.__initMap = callback;
            document.head.appendChild(script);
        }

        function renderMap(stores) {
            if (!GOOGLE_MAPS_API_KEY || !userLat) return;
            const container = document.getElementById("map-container");
            container.classList.remove("hidden");

            map = new google.maps.Map(container, { center: { lat: userLat, lng: userLng }, zoom: 13 });

            new google.maps.Marker({
                position: { lat: userLat, lng: userLng },
                map,
                label: "You",
                icon: { url: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png" },
            });

            stores.forEach(store => {
                if (store.latitude && store.longitude) {
                    new google.maps.Marker({ position: { lat: store.latitude, lng: store.longitude }, map, title: store.store_name });
                }
            });
        }

        async function loadNearbyStores() {
            try {
                const stores = await apiFetch(`/customers/nearby-stores?latitude=${userLat}&longitude=${userLng}&radius_km=10`, { auth: false });
                const container = document.getElementById("nearby-stores");
                container.innerHTML = stores.length
                    ? stores.map(s => `
                        <div class="bg-white border border-gray-100 rounded-xl p-3 flex gap-3 items-center shadow-sm hover:border-gray-200 transition cursor-pointer">
                            <div class="w-14 h-14 bg-gray-100 rounded-lg flex items-center justify-center text-gray-400 flex-shrink-0">
                                <i data-lucide="store" class="w-6 h-6"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                                <h4 class="text-xs font-bold text-gray-900 truncate">${s.store_name}</h4>
                                <div class="flex items-center gap-2 text-[10px] text-gray-400 font-semibold mt-0.5">
                                    <span class="flex items-center gap-0.5 text-amber-500"><i data-lucide="star" class="w-3 h-3 fill-current"></i> ${s.rating.toFixed(1)}</span>
                                    <span>• ${s.distance_km} km away</span>
                                </div>
                            </div>
                        </div>`).join("")
                    : `<p class="text-xs text-gray-400 col-span-3">No stores found within 10km yet. Merchants need to set up their store with GPS coordinates first.</p>`;
                lucide.createIcons();

                if (GOOGLE_MAPS_API_KEY) loadGoogleMapsScript(() => renderMap(stores));
            } catch (err) {
                document.getElementById("nearby-stores").innerHTML = `<p class="text-xs text-red-500 col-span-3">${err.message}</p>`;
            }
        }

        async function runSearch(query) {
            if (!query.trim()) {
                document.getElementById("search-results-section").classList.add("hidden");
                return;
            }
            document.getElementById("search-query-label").textContent = query;
            document.getElementById("search-results-section").classList.remove("hidden");

            try {
                let url = `/customers/search-products?q=${encodeURIComponent(query)}`;
                if (userLat) url += `&latitude=${userLat}&longitude=${userLng}`;
                const results = await apiFetch(url, { auth: false });

                const container = document.getElementById("search-results");
                container.innerHTML = results.length
                    ? results.map(p => `
                        <a href="products-detail.html?product_id=${p.product_id}&name=${encodeURIComponent(p.product_name)}&price=${p.selling_price}&store_id=${p.store_id}&store_name=${encodeURIComponent(p.store_name)}&qty_available=${p.quantity_available}"
                           class="bg-white border border-gray-100 rounded-xl p-4 space-y-2 shadow-sm block hover:border-gray-300 transition">
                            <h4 class="text-sm font-bold text-gray-900">${p.product_name}</h4>
                            <p class="text-[11px] text-gray-400 font-medium">${p.brand || ""}</p>
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-extrabold text-gray-900">₹${p.selling_price}</span>
                                <span class="text-[10px] text-gray-500 font-semibold">at ${p.store_name}</span>
                            </div>
                            <span class="text-[10px] text-gray-400">${p.quantity_available} in stock</span>
                        </a>`).join("")
                    : `<p class="text-xs text-gray-400 col-span-3">No stores near you currently have "${query}" in stock.</p>`;
            } catch (err) {
                document.getElementById("search-results").innerHTML = `<p class="text-xs text-red-500 col-span-3">${err.message}</p>`;
            }
        }

        let searchDebounce;
        document.getElementById("search-input").addEventListener("input", (e) => {
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => runSearch(e.target.value), 400);
        });

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    locationLabel.textContent = "Current location";
                    loadNearbyStores();
                },
                () => {
                    locationLabel.textContent = "Location unavailable";
                    userLat = 19.076; userLng = 72.877;
                    loadNearbyStores();
                }
            );
        } else {
            userLat = 19.076; userLng = 72.877;
            loadNearbyStores();
        }
    </script>
</body>
</html>
