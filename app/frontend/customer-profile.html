<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - VyapaarSetu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f8f9fa] text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 px-4 lg:px-16 h-16 flex items-center justify-between gap-4 sticky top-0 z-50">
        <a href="customer-dashboard.html" class="text-xl font-black text-[#009640] tracking-tight">VyapaarSetu</a>
    </header>

    <main class="flex-1 max-w-6xl mx-auto w-full px-4 lg:px-8 py-4 grid grid-cols-1 md:grid-cols-4 gap-8 items-start">
        <aside class="space-y-6">
            <div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">My Account</h1>
                <p class="text-xs text-gray-400 font-medium mt-0.5">Manage your profile and addresses.</p>
            </div>
            <nav class="space-y-1">
                <button id="logout-btn" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-xs font-bold text-red-600 hover:bg-red-50/50 transition text-left">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span>Sign Out</span>
                </button>
            </nav>
        </aside>

        <div class="md:col-span-3 space-y-6">
            <section class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-xs">
                <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-white">
                    <h2 class="text-sm font-bold text-gray-900 tracking-tight">Personal Information</h2>
                </div>
                <div class="p-6 space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="text-[11px] font-bold text-gray-500">Full Name</label>
                            <input id="profile-name" type="text"
                                   class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-xs font-medium text-gray-800 focus:outline-none focus:border-[#009640] transition">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[11px] font-bold text-gray-500">Email Address</label>
                            <input id="profile-email" type="email" disabled
                                   class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-xs font-medium text-gray-500 bg-gray-50">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[11px] font-bold text-gray-500">Phone Number</label>
                            <input id="profile-phone" type="tel"
                                   class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-xs font-medium text-gray-800 focus:outline-none focus:border-[#009640] transition">
                        </div>
                    </div>
                    <div class="flex gap-3 pt-2">
                        <button id="save-profile-btn" class="bg-[#009640] hover:bg-[#007a33] text-white text-xs font-bold px-4 py-2.5 rounded-lg shadow-xs transition">Update Profile</button>
                    </div>
                </div>
            </section>

            <section class="space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-bold text-gray-900 tracking-tight">Saved Addresses</h2>
                    <button id="add-address-btn" class="text-xs font-bold text-[#009640] flex items-center gap-1 hover:underline">
                        <i data-lucide="plus" class="w-4 h-4"></i> Add New
                    </button>
                </div>
                <div id="addresses-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <p class="text-xs text-gray-400 col-span-2">Loading addresses...</p>
                </div>
            </section>
            <section class="space-y-3">
    <h2 class="text-sm font-bold text-gray-900 tracking-tight">Order History</h2>
    <div id="orders-list" class="space-y-3">
        <p class="text-xs text-gray-400">Loading your orders...</p>
    </div>
</section>
        </div>
    </main>

    <div id="address-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-3">
            <h3 class="text-sm font-bold text-gray-900">Add Address</h3>
            <input id="addr-label" placeholder="Label (e.g. Home, Work)" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs">
            <textarea id="addr-text" placeholder="Full address" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs"></textarea>
            <label class="flex items-center gap-2 text-xs text-gray-600">
                <input id="addr-default" type="checkbox"> Set as default
            </label>
            <div class="flex gap-2 pt-2">
                <button id="addr-cancel-btn" class="flex-1 border border-gray-200 rounded-lg py-2 text-xs font-bold text-gray-600">Cancel</button>
                <button id="addr-save-btn" class="flex-1 bg-[#009640] text-white rounded-lg py-2 text-xs font-bold">Save</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        lucide.createIcons();
        requireAuth("customer", "login.html");
        document.getElementById("logout-btn").addEventListener("click", () => { clearSession(); window.location.href = "login.html"; });

        async function loadProfile() {
            try {
                const profile = await apiFetch("/customers/me");
                document.getElementById("profile-name").value = profile.name || "";
                document.getElementById("profile-email").value = profile.email;
                document.getElementById("profile-phone").value = profile.phone || "";
            } catch (err) { alert(err.message); }
        }

        document.getElementById("save-profile-btn").addEventListener("click", async () => {
            try {
                await apiFetch("/customers/me", {
                    method: "PATCH",
                    body: { name: document.getElementById("profile-name").value, phone: document.getElementById("profile-phone").value },
                });
                alert("Profile updated!");
            } catch (err) { alert(err.message); }
        });

        async function loadAddresses() {
            try {
                const addresses = await apiFetch("/customers/addresses");
                document.getElementById("addresses-grid").innerHTML = addresses.length ? addresses.map(a => `
                    <div class="bg-white border border-gray-200 rounded-xl p-4 space-y-3 shadow-xs relative">
                        <div class="flex justify-between items-start">
                            <div class="flex items-center gap-1.5">
                                <i data-lucide="${a.label.toLowerCase() === 'home' ? 'home' : 'building-2'}" class="w-4 h-4 text-[#009640]"></i>
                                <span class="text-xs font-bold text-gray-900">${a.label}</span>
                                ${a.is_default ? '<span class="text-[9px] uppercase font-black text-green-700 bg-green-50 px-1.5 py-0.5 rounded tracking-wide">Default</span>' : ''}
                            </div>
                        </div>
                        <p class="text-[11px] text-gray-500 font-medium leading-relaxed">${a.address_text}</p>
                        <button class="remove-addr-btn text-[10px] font-bold text-red-500 hover:text-red-700 transition" data-id="${a.id}">Remove</button>
                    </div>
                `).join("") : `<p class="text-xs text-gray-400 col-span-2">No saved addresses yet.</p>`;

                lucide.createIcons();
                document.querySelectorAll(".remove-addr-btn").forEach(btn => {
                    btn.addEventListener("click", async () => {
                        try {
                            await apiFetch(`/customers/addresses/${btn.dataset.id}`, { method: "DELETE" });
                            loadAddresses();
                        } catch (err) { alert(err.message); }
                    });
                });
            } catch (err) {
                document.getElementById("addresses-grid").innerHTML = `<p class="text-xs text-red-500 col-span-2">${err.message}</p>`;
            }
        }
        async function loadOrderHistory() {
    try {
        const orders = await apiFetch("/orders/mine");
        const statusColors = {
            created: 'bg-amber-50 text-amber-700',
            accepted: 'bg-indigo-50 text-indigo-700',
            packed: 'bg-blue-50 text-blue-700',
            completed: 'bg-green-50 text-green-700',
            cancelled: 'bg-red-50 text-red-600',
        };
        document.getElementById("orders-list").innerHTML = orders.length ? orders.map(o => `
            <div class="bg-white border border-gray-200 rounded-xl p-4 space-y-2">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs font-bold text-gray-900">Order #${o.id}</span>
                        <span class="text-[10px] text-gray-400 block">${new Date(o.created_at).toLocaleString()}</span>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded ${statusColors[o.status] || 'bg-gray-50 text-gray-600'}">${o.status}</span>
                </div>
                <div class="text-[11px] text-gray-500">
                    ${o.items.map(i => `${i.product_name} × ${i.quantity}`).join(", ")}
                </div>
                <div class="flex justify-between items-center pt-1 border-t border-gray-100">
                    <span class="text-[10px] text-gray-400">${o.payment_status === 'paid' ? '✅ Paid' : '⏳ Payment pending'}</span>
                    <span class="text-sm font-bold text-gray-900">₹${o.total_amount.toLocaleString("en-IN")}</span>
                </div>
            </div>
        `).join("") : `<p class="text-xs text-gray-400">You haven't placed any orders yet.</p>`;
    } catch (err) {
        document.getElementById("orders-list").innerHTML = `<p class="text-xs text-red-500">${err.message}</p>`;
    }
}


        document.getElementById("add-address-btn").addEventListener("click", () => document.getElementById("address-modal").classList.remove("hidden"));
        document.getElementById("addr-cancel-btn").addEventListener("click", () => document.getElementById("address-modal").classList.add("hidden"));
        document.getElementById("addr-save-btn").addEventListener("click", async () => {
            try {
                await apiFetch("/customers/addresses", {
                    method: "POST",
                    body: {
                        label: document.getElementById("addr-label").value,
                        address_text: document.getElementById("addr-text").value,
                        is_default: document.getElementById("addr-default").checked,
                    },
                });
                document.getElementById("address-modal").classList.add("hidden");
                loadAddresses();
            } catch (err) { alert(err.message); }
        });

        loadProfile();
        loadAddresses();
        loadOrderHistory();
    </script>
</body>
</html>
