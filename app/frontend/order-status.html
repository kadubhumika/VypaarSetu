<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VyapaarSetu - Order Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f4f6fa] text-gray-800 antialiased min-h-screen flex">

    <aside class="w-64 bg-[#f0f4fd] border-r border-gray-200 flex flex-col justify-between fixed h-screen z-20">
        <div>
            <div class="p-5 flex items-center gap-3">
                <div class="bg-[#009640] text-white p-2 rounded-xl shadow-sm"><i data-lucide="store" class="w-5 h-5"></i></div>
                <div>
                    <h2 class="text-lg font-bold text-[#00642d] tracking-tight leading-none">VyapaarSetu</h2>
                    <span class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Merchant Portal</span>
                </div>
            </div>
            <nav class="px-3 mt-4 space-y-1">
                <a href="merchant-dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900 text-sm font-medium rounded-xl transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </a>
                <a href="check-inventory.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900 text-sm font-medium rounded-xl transition">
                    <i data-lucide="archive" class="w-4 h-4"></i> Inventory
                </a>
                <a href="upload-invoice.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900 text-sm font-medium rounded-xl transition">
                    <i data-lucide="file-up" class="w-4 h-4"></i> Upload Invoice
                </a>
                <a href="order-status.html" class="flex items-center gap-3 px-4 py-3 bg-[#009640] text-white text-sm font-semibold rounded-xl transition">
                    <i data-lucide="shopping-cart" class="w-4 h-4"></i> Orders
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-200 bg-[#f0f4fd]">
            <a href="#" id="logout-btn" class="flex items-center justify-center gap-2 text-red-600 hover:bg-red-50 text-xs font-semibold py-2 rounded-xl transition">
                <i data-lucide="log-out" class="w-4 h-4"></i> Logout
            </a>
        </div>
    </aside>

    <div class="flex-1 ml-64 flex flex-col min-h-screen bg-[#f8f9fc]">
        <header class="bg-white border-b border-gray-100 sticky top-0 z-10 shadow-sm h-20 px-8 flex items-center justify-between">
            <div><span class="text-sm font-bold text-[#00642d]">VyapaarSetu</span></div>
            <div class="flex items-center gap-4">
                <button id="refresh-btn" class="p-2 text-gray-500 hover:text-gray-800 transition"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
            </div>
        </header>

        <main class="p-8 space-y-6 flex-1">
            <div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">Order Management</h1>
                <p class="text-[11px] text-gray-500 font-medium">Track and process your store's customer transactions.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                    <div><span class="text-[10px] uppercase font-bold tracking-wider text-gray-400 block">Total Orders</span><span id="stat-total" class="text-xl font-extrabold text-gray-900">0</span></div>
                    <div class="p-3 bg-green-50 text-[#009640] rounded-xl"><i data-lucide="shopping-bag" class="w-5 h-5"></i></div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                    <div><span class="text-[10px] uppercase font-bold tracking-wider text-gray-400 block">Awaiting Your Response</span><span id="stat-pending" class="text-xl font-extrabold text-gray-900">0</span></div>
                    <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="clipboard-list" class="w-5 h-5"></i></div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                    <div><span class="text-[10px] uppercase font-bold tracking-wider text-gray-400 block">Total Revenue (Paid)</span><span id="stat-revenue" class="text-xl font-extrabold text-gray-900">₹0</span></div>
                    <div class="p-3 bg-teal-50 text-teal-600 rounded-xl"><i data-lucide="credit-card" class="w-5 h-5"></i></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                <div class="p-4 flex gap-1 text-xs font-semibold text-gray-500 border-b border-gray-100">
                    <button class="filter-tab bg-[#f0f4fd] text-gray-900 px-4 py-1.5 rounded-lg" data-filter="all">All Orders</button>
                    <button class="filter-tab hover:text-gray-900 px-4 py-1.5 transition" data-filter="pending">Awaiting Response</button>
                    <button class="filter-tab hover:text-gray-900 px-4 py-1.5 transition" data-filter="completed">Completed</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-gray-400 uppercase font-bold tracking-wider border-b border-gray-100 text-[10px]">
                                <th class="py-3 px-6">Order ID</th>
                                <th class="py-3 px-4">Customer</th>
                                <th class="py-3 px-4">Date</th>
                                <th class="py-3 px-4">Amount (₹)</th>
                                <th class="py-3 px-4">Payment</th>
                                <th class="py-3 px-4">Status</th>
                                <th class="py-3 px-6 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-body" class="divide-y divide-gray-100 font-medium text-gray-700">
                            <tr><td colspan="7" class="py-6 px-5 text-center text-gray-400">Loading orders...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        lucide.createIcons();
        requireAuth("merchant", "login.html");
        document.getElementById("logout-btn").addEventListener("click", (e) => { e.preventDefault(); clearSession(); window.location.href = "login.html"; });

        let allOrders = [];
        let activeFilter = "all";

        const statusBadge = (status) => ({
            created: '<span class="bg-amber-50 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded">Awaiting Response</span>',
            accepted: '<span class="bg-indigo-50 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded">Accepted</span>',
            packed: '<span class="bg-blue-50 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded">Packed</span>',
            completed: '<span class="bg-[#009640] text-white text-[10px] font-bold px-2 py-0.5 rounded">Completed</span>',
            cancelled: '<span class="bg-red-50 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded">Cancelled</span>',
        }[status] || status);

        const paymentBadge = (status) => status === "paid"
            ? '<span class="bg-green-50 text-green-700 text-[10px] font-bold px-2 py-0.5 rounded">Paid</span>'
            : '<span class="bg-red-50 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded">Pending</span>';

        function actionButtons(order) {
            const buttons = [];
            if (order.status === "created") {
                buttons.push(`<button class="status-btn text-[#009640] font-bold hover:underline mr-2" data-id="${order.id}" data-status="accepted">Accept & Pack</button>`);
                buttons.push(`<button class="status-btn text-red-500 font-bold hover:underline" data-id="${order.id}" data-status="cancelled">Out of Stock</button>`);
            } else if (order.status === "accepted") {
                buttons.push(`<button class="status-btn text-blue-600 font-bold hover:underline" data-id="${order.id}" data-status="packed">Mark Packed</button>`);
            } else if (order.status === "packed") {
                buttons.push(`<button class="status-btn text-[#009640] font-bold hover:underline" data-id="${order.id}" data-status="completed">Mark Completed</button>`);
            } else {
                buttons.push(`<span class="text-gray-300">—</span>`);
            }
            return buttons.join("");
        }

        async function loadOrders() {
            try {
                allOrders = await apiFetch("/orders/store");
                document.getElementById("stat-total").textContent = allOrders.length;
                document.getElementById("stat-pending").textContent = allOrders.filter(o => o.status === "created").length;
                const revenue = allOrders.filter(o => o.payment_status === "paid").reduce((s, o) => s + o.total_amount, 0);
                document.getElementById("stat-revenue").textContent = `₹${revenue.toLocaleString("en-IN")}`;
                renderTable();
            } catch (err) {
                document.getElementById("orders-body").innerHTML = `<tr><td colspan="7" class="py-6 px-5 text-center text-red-500">${err.message}</td></tr>`;
            }
        }

        function renderTable() {
            let filtered = allOrders;
            if (activeFilter === "pending") filtered = allOrders.filter(o => o.status === "created");
            if (activeFilter === "completed") filtered = allOrders.filter(o => o.status === "completed");

            document.getElementById("orders-body").innerHTML = filtered.length ? filtered.map(o => `
                <tr class="hover:bg-slate-50/40 transition">
                    <td class="py-3.5 px-6 font-bold text-[#009640]">#${o.id}</td>
                    <td class="py-3.5 px-4 font-bold text-gray-900">${o.customer_name || 'Customer #' + o.customer_id}</td>
                    <td class="py-3.5 px-4 text-gray-500">${new Date(o.created_at).toLocaleDateString()}</td>
                    <td class="py-3.5 px-4 font-bold text-gray-900">₹${o.total_amount.toLocaleString("en-IN")}</td>
                    <td class="py-3.5 px-4">${paymentBadge(o.payment_status)}</td>
                    <td class="py-3.5 px-4">${statusBadge(o.status)}</td>
                    <td class="py-3.5 px-6 text-right">${actionButtons(o)}</td>
                </tr>`).join("") : `<tr><td colspan="7" class="py-6 px-5 text-center text-gray-400">No orders in this view yet.</td></tr>`;

            document.querySelectorAll(".status-btn").forEach(btn => {
                btn.addEventListener("click", async () => {
                    try {
                        await apiFetch(`/orders/${btn.dataset.id}/status`, { method: "PATCH", body: { status: btn.dataset.status } });
                        loadOrders();
                    } catch (err) { alert(err.message); }
                });
            });
        }

        document.querySelectorAll(".filter-tab").forEach(tab => {
            tab.addEventListener("click", () => {
                activeFilter = tab.dataset.filter;
                document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("bg-[#f0f4fd]", "text-gray-900"));
                tab.classList.add("bg-[#f0f4fd]", "text-gray-900");
                renderTable();
            });
        });

        document.getElementById("refresh-btn").addEventListener("click", loadOrders);
        loadOrders();
    </script>
</body>
</html>
