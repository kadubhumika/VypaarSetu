<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VyapaarSetu - Store Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f4f6fa] text-gray-800 antialiased min-h-screen flex">

    <aside class="w-64 bg-[#f0f4fd] border-r border-gray-200 flex flex-col justify-between fixed h-screen z-20">
        <div>
            <div class="p-5 flex items-center gap-3">
                <div class="bg-[#009640] text-white p-2 rounded-xl shadow-sm"><i data-lucide="store" class="w-5 h-5"></i></div>
                <div>
                    <h2 class="text-lg font-bold text-[#00642d] tracking-tight leading-none">VyapaarSetu</h2>
                    <span class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Merchant Hub</span>
                </div>
            </div>
            <nav class="px-3 mt-4 space-y-1">
                <a href="merchant-dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900 text-sm font-medium rounded-xl transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </a>
                <a href="check-inventory.html" class="flex items-center gap-3 px-4 py-3 bg-[#009640] text-white text-sm font-semibold rounded-xl transition">
                    <i data-lucide="archive" class="w-4 h-4"></i> Inventory
                </a>
                <a href="upload-invoice.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900 text-sm font-medium rounded-xl transition">
                    <i data-lucide="file-up" class="w-4 h-4"></i> Upload Invoice
                </a>
                <a href="order-status.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900 text-sm font-medium rounded-xl transition">
                    <i data-lucide="shopping-cart" class="w-4 h-4"></i> Orders
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-200 bg-[#f0f4fd] space-y-2">
            <button id="add-product-btn" class="w-full flex items-center justify-center gap-2 bg-[#009640] hover:bg-[#007a33] text-white font-semibold py-3 px-4 rounded-xl text-xs transition shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Product
            </button>
            <a href="#" id="logout-btn" class="flex items-center justify-center gap-2 text-red-600 hover:bg-red-50 text-xs font-semibold py-2 rounded-xl transition">
                <i data-lucide="log-out" class="w-4 h-4"></i> Logout
            </a>
        </div>
    </aside>

    <div class="flex-1 ml-64 flex flex-col min-h-screen bg-[#f8f9fc]">
        <header class="bg-white border-b border-gray-100 sticky top-0 z-10 shadow-sm">
            <div class="h-20 px-8 flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold text-gray-900 tracking-tight">Store Inventory</h1>
                    <p class="text-[11px] text-gray-500 font-medium">Manage your products by category</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-72 relative">
                        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 transform -translate-y-1/2"></i>
                        <input id="search-input" type="text" placeholder="Search items..."
                               class="w-full pl-10 pr-4 py-2 bg-[#f1f3f7] rounded-lg text-xs placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-[#009640] transition">
                    </div>
                </div>
            </div>
            <div id="category-tabs" class="px-8 flex gap-6 text-xs font-semibold text-gray-500 pb-3 border-t border-gray-50 pt-3 overflow-x-auto"></div>
        </header>

        <main class="p-8 space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                    <div><span class="text-[10px] uppercase font-bold tracking-wider text-gray-400 block">Total Products</span><span id="stat-total" class="text-xl font-extrabold text-gray-900">0</span></div>
                    <div class="p-3 bg-green-50 text-[#009640] rounded-xl"><i data-lucide="box" class="w-5 h-5"></i></div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                    <div><span class="text-[10px] uppercase font-bold tracking-wider text-gray-400 block">Low Stock</span><span id="stat-low-stock" class="text-xl font-extrabold text-red-500">0</span></div>
                    <div class="p-3 bg-red-50 text-red-500 rounded-xl"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                    <div><span class="text-[10px] uppercase font-bold tracking-wider text-gray-400 block">Stock Value</span><span id="stat-value" class="text-xl font-extrabold text-gray-900">₹0</span></div>
                    <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="trending-up" class="w-5 h-5"></i></div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                    <div><span class="text-[10px] uppercase font-bold tracking-wider text-gray-400 block">Categories</span><span id="stat-categories" class="text-xl font-extrabold text-gray-900">0</span></div>
                    <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><i data-lucide="layers" class="w-5 h-5"></i></div>
                </div>
            </div>

            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">
                <p class="text-xs text-gray-400 col-span-4">Loading inventory...</p>
            </div>
        </main>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-4">
        <h3 class="text-sm font-bold text-gray-900">Edit Stock</h3>
        <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500">Quantity</label>
            <input id="edit-quantity" type="number" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs">
        </div>
        <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500">Selling Price (₹)</label>
            <input id="edit-price" type="number" step="0.01" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs">
        </div>

        <div class="space-y-1.5 border-t border-gray-100 pt-3">
            <label class="text-[11px] font-bold text-gray-500">Product Image</label>
            <div class="flex gap-2 mb-2">
                <label class="flex-1 text-center border border-gray-200 rounded-lg py-2 text-[10px] font-bold text-gray-600 cursor-pointer hover:bg-gray-50">
                    📁 Upload Image
                    <input id="edit-image-upload" type="file" accept="image/*" class="hidden">
                </label>
                <label class="flex-1 text-center border border-gray-200 rounded-lg py-2 text-[10px] font-bold text-gray-600 cursor-pointer hover:bg-gray-50">
                    📷 Camera
                    <input id="edit-image-camera" type="file" accept="image/*" capture="environment" class="hidden">
                </label>
            </div>
            <input id="edit-image-url" type="text" placeholder="Or paste an image URL"
                   class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs">
            <p id="edit-image-status" class="text-[10px] text-gray-400"></p>
        </div>

        <div class="flex gap-2 pt-2">
            <button id="edit-cancel-btn" class="flex-1 border border-gray-200 rounded-lg py-2 text-xs font-bold text-gray-600">Cancel</button>
            <button id="edit-save-btn" class="flex-1 bg-[#009640] text-white rounded-lg py-2 text-xs font-bold">Save</button>
            <button id="edit-delete-btn" class="border border-red-200 text-red-600 rounded-lg px-3 py-2 text-xs font-bold">Delete</button>
        </div>
    </div>
</div>

    <div id="add-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-3">
            <h3 class="text-sm font-bold text-gray-900">Add Product</h3>
            <input id="add-category" placeholder="Category (e.g. Grocery)" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs">
            <input id="add-name" placeholder="Product name" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs">
            <input id="add-quantity" type="number" placeholder="Quantity" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs">
            <input id="add-purchase-price" type="number" step="0.01" placeholder="Purchase price" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs">
            <input id="add-selling-price" type="number" step="0.01" placeholder="Selling price" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs">
            <div class="flex gap-2 pt-2">
                <button id="add-cancel-btn" class="flex-1 border border-gray-200 rounded-lg py-2 text-xs font-bold text-gray-600">Cancel</button>
                <button id="add-save-btn" class="flex-1 bg-[#009640] text-white rounded-lg py-2 text-xs font-bold">Add</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        lucide.createIcons();
        requireAuth("merchant", "login.html");
        document.getElementById("logout-btn").addEventListener("click", (e) => { e.preventDefault(); clearSession(); window.location.href = "login.html"; });

        let allItems = [];
        let activeCategory = "All";
        let editingId = null;

        async function loadInventory() {
            try {
                allItems = await apiFetch("/inventory");
                renderStats();
                renderCategoryTabs();
                renderGrid();
            } catch (err) {
                document.getElementById("product-grid").innerHTML = `<p class="text-xs text-red-500 col-span-4">${err.message}</p>`;
            }
        }

        function renderStats() {
            document.getElementById("stat-total").textContent = allItems.length;
            document.getElementById("stat-low-stock").textContent = allItems.filter(i => i.is_low_stock).length;
            const value = allItems.reduce((sum, i) => sum + i.selling_price * i.quantity, 0);
            document.getElementById("stat-value").textContent = `₹${value.toLocaleString("en-IN")}`;
            document.getElementById("stat-categories").textContent = new Set(allItems.map(i => i.category_name)).size;
        }

        function renderCategoryTabs() {
            const categories = ["All", ...new Set(allItems.map(i => i.category_name))];
            document.getElementById("category-tabs").innerHTML = categories.map(cat => `
                <a href="#" data-cat="${cat}" class="cat-tab pb-2 px-1 ${cat === activeCategory ? 'text-[#009640] border-b-2 border-[#009640] font-bold' : 'hover:text-gray-900 transition'}">${cat}</a>
            `).join("");
            document.querySelectorAll(".cat-tab").forEach(tab => {
                tab.addEventListener("click", (e) => {
                    e.preventDefault();
                    activeCategory = tab.dataset.cat;
                    renderCategoryTabs();
                    renderGrid();
                });
            });
        }

        function renderGrid() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = allItems.filter(i =>
                (activeCategory === "All" || i.category_name === activeCategory) &&
                i.product_name.toLowerCase().includes(query)
            );

            document.getElementById("product-grid").innerHTML = filtered.length ? filtered.map(item => `
                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden flex flex-col justify-between">
                    <div class="p-4 relative">
                        <span class="absolute top-6 right-6 z-10 ${item.is_low_stock ? 'bg-red-50 text-red-500' : 'bg-green-50 text-[#009640]'} text-[9px] font-bold px-2 py-0.5 rounded-md flex items-center gap-1">
                            <i data-lucide="${item.is_low_stock ? 'alert-circle' : 'check'}" class="w-2.5 h-2.5"></i> ${item.is_low_stock ? 'Low Stock' : 'In Stock'}
                        </span>
                        <div class="w-full h-32 bg-slate-50 rounded-xl overflow-hidden mb-3 flex items-center justify-center text-gray-300">
    ${item.image_url ? `<img src="${API_BASE_URL}${item.image_url}" class="w-full h-full object-cover">` : `<i data-lucide="package" class="w-10 h-10"></i>`}
</div>
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="text-sm font-bold text-gray-900">${item.product_name}</h3>
                                <p class="text-[10px] text-gray-400 font-semibold mt-0.5">${item.brand || ''} • ${item.category_name}</p>
                            </div>
                            <span class="text-sm font-extrabold text-gray-900">₹${item.selling_price}</span>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex justify-between items-center">
                        <div>
                            <span class="text-[9px] text-gray-400 font-bold uppercase tracking-wider block">Stock Level</span>
                            <span class="text-xs font-bold ${item.is_low_stock ? 'text-red-500' : 'text-gray-800'}">${item.quantity} units</span>
                        </div>
                        <button class="edit-btn p-2 border border-gray-200 text-gray-600 rounded-lg hover:bg-slate-50 transition" data-id="${item.inventory_id}" data-qty="${item.quantity}" data-price="${item.selling_price}">
                            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
            `).join("") : `<p class="text-xs text-gray-400 col-span-4">No items match. Try Upload Invoice or Add Product.</p>`;

            lucide.createIcons();
            document.querySelectorAll(".edit-btn").forEach(btn => {
                btn.addEventListener("click", () => openEditModal(btn.dataset.id, btn.dataset.qty, btn.dataset.price));
            });
        }

        document.getElementById("search-input").addEventListener("input", renderGrid);

        function openEditModal(id, qty, price) {
    editingId = id;
    document.getElementById("edit-quantity").value = qty;
    document.getElementById("edit-price").value = price;
    document.getElementById("edit-image-url").value = "";
    document.getElementById("edit-image-status").textContent = "";
    document.getElementById("edit-modal").classList.remove("hidden");
}
        document.getElementById("edit-cancel-btn").addEventListener("click", () => document.getElementById("edit-modal").classList.add("hidden"));

        let pendingImageUrl = null;

async function handleImageUpload(file) {
    const statusEl = document.getElementById("edit-image-status");
    statusEl.textContent = "Uploading...";
    const formData = new FormData();
    formData.append("file", file);
    try {
        const result = await apiFetch("/inventory/upload-image", { method: "POST", isFormData: true, body: formData });
        pendingImageUrl = result.image_url;
        document.getElementById("edit-image-url").value = result.image_url;
        statusEl.textContent = "✅ Image uploaded — click Save to apply.";
    } catch (err) {
        statusEl.textContent = "❌ " + err.message;
    }
}

document.getElementById("edit-image-upload").addEventListener("change", (e) => {
    if (e.target.files.length) handleImageUpload(e.target.files[0]);
});
document.getElementById("edit-image-camera").addEventListener("change", (e) => {
    if (e.target.files.length) handleImageUpload(e.target.files[0]);
});

document.getElementById("edit-save-btn").addEventListener("click", async () => {
    try {
        const imageUrl = document.getElementById("edit-image-url").value.trim();
        const body = {
            quantity: Number(document.getElementById("edit-quantity").value),
            selling_price: Number(document.getElementById("edit-price").value),
        };
        if (imageUrl) body.image_url = imageUrl;

        await apiFetch(`/inventory/${editingId}`, { method: "PATCH", body });
        document.getElementById("edit-modal").classList.add("hidden");
        pendingImageUrl = null;
        loadInventory();
    } catch (err) { alert(err.message); }
});

        document.getElementById("edit-delete-btn").addEventListener("click", async () => {
            if (!confirm("Remove this item from inventory?")) return;
            try {
                await apiFetch(`/inventory/${editingId}`, { method: "DELETE" });
                document.getElementById("edit-modal").classList.add("hidden");
                loadInventory();
            } catch (err) { alert(err.message); }
        });

        document.getElementById("add-product-btn").addEventListener("click", () => document.getElementById("add-modal").classList.remove("hidden"));
        document.getElementById("add-cancel-btn").addEventListener("click", () => document.getElementById("add-modal").classList.add("hidden"));
        document.getElementById("add-save-btn").addEventListener("click", async () => {
            try {
                await apiFetch("/inventory/products", {
                    method: "POST",
                    body: {
                        category_name: document.getElementById("add-category").value,
                        name: document.getElementById("add-name").value,
                        quantity: Number(document.getElementById("add-quantity").value),
                        purchase_price: Number(document.getElementById("add-purchase-price").value),
                        selling_price: Number(document.getElementById("add-selling-price").value),
                    },
                });
                document.getElementById("add-modal").classList.add("hidden");
                loadInventory();
            } catch (err) { alert(err.message); }
        });

        loadInventory();
    </script>
</body>
</html>
