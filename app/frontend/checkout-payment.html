<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout & Payment - VyapaarSetu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f8f9fa] text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-100 px-4 lg:px-16 h-16 flex items-center justify-between gap-4">
        <span class="text-xl font-black text-[#009640] tracking-tight">VyapaarSetu</span>
        <div class="flex items-center gap-6 text-xs font-bold text-gray-600 ml-auto flex-shrink-0">
            <div class="flex items-center gap-1 text-gray-500 font-medium">
                <i data-lucide="map-pin" class="w-4 h-4 text-gray-400"></i>
                <span id="location-label">Detecting location...</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto w-full px-4 lg:px-8 py-8 space-y-8">

        <div id="error-banner" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs font-semibold rounded-lg px-4 py-3"></div>
        <div id="config-notice" class="hidden bg-amber-50 border border-amber-200 text-amber-800 text-xs font-semibold rounded-lg px-4 py-3"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <div class="lg:col-span-2 space-y-8">
                <div class="space-y-4">
                    <div class="flex items-center gap-2 text-gray-900">
                        <i data-lucide="truck" class="w-5 h-5 text-gray-700"></i>
                        <h2 class="text-sm font-bold tracking-tight">Delivery Address</h2>
                    </div>
                    <div id="address-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <p class="text-xs text-gray-400">Loading saved addresses...</p>
                    </div>
                </div>
            </div>

            <div class="bg-white border border-gray-200 rounded-2xl p-5 space-y-5 shadow-xs lg:sticky lg:top-24">
                <h3 class="text-xs font-bold text-gray-900 uppercase tracking-tight">Order Summary</h3>

                <div id="order-items" class="space-y-3 max-h-48 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400">Loading order...</p>
                </div>

                <div class="border-t border-gray-100 pt-4 flex justify-between items-center">
                    <span class="text-sm font-bold text-gray-900">Order Total</span>
                    <span id="order-total" class="text-xl font-black text-gray-900">₹0</span>
                </div>

                <button id="pay-now-btn" disabled
                        class="w-full bg-[#006b2b] hover:bg-[#005422] disabled:opacity-50 disabled:cursor-not-allowed text-white text-xs font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-sm">
                    <i data-lucide="lock" class="w-4 h-4"></i>
                    <span id="pay-now-label">Loading...</span>
                </button>
                <button id="pay-credit-btn" disabled
        class="w-full bg-white border-2 border-[#009640] disabled:opacity-50 disabled:cursor-not-allowed text-[#009640] text-xs font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition">
    <i data-lucide="book-open" class="w-4 h-4"></i>
    <span>Pay on Credit (Udhaar)</span>
</button>

                <p class="text-[10px] text-center text-gray-400 font-medium leading-relaxed">
                    By placing your order, you agree to VyapaarSetu's
                    <a href="#" class="underline hover:text-gray-600">Terms of Use</a> and <a href="#" class="underline hover:text-gray-600">Privacy Policy</a>.
                </p>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        lucide.createIcons();
        requireAuth("customer", "login.html");

        const params = new URLSearchParams(window.location.search);
        const orderId = params.get("order_id");
        const errorBanner = document.getElementById("error-banner");
        const configNotice = document.getElementById("config-notice");
        const payBtn = document.getElementById("pay-now-btn");
        const payLabel = document.getElementById("pay-now-label");

        let currentOrder = null;
        let razorpayKeyId = null;

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.remove("hidden");
        }

        async function loadOrder() {
            if (!orderId) { showError("No order specified. Go back to your cart and try again."); return; }
            try {
                const orders = await apiFetch("/orders/mine");
                currentOrder = orders.find(o => String(o.id) === String(orderId));
                if (!currentOrder) { showError("Order not found."); return; }

                document.getElementById("order-items").innerHTML = currentOrder.items.map(item => `
                    <div class="flex gap-3 items-center">
                        <div class="min-w-0 flex-1">
                            <h4 class="text-xs font-bold text-gray-900 truncate">${item.product_name}</h4>
                            <span class="text-[10px] text-gray-400 font-semibold block mt-0.5">Qty: ${item.quantity}</span>
                        </div>
                        <span class="text-xs font-bold text-gray-800">₹${item.subtotal.toLocaleString("en-IN")}</span>
                    </div>`).join("");

                document.getElementById("order-total").textContent = `₹${currentOrder.total_amount.toLocaleString("en-IN")}`;
                payLabel.textContent = `Pay ₹${currentOrder.total_amount.toLocaleString("en-IN")}`;
                payBtn.disabled = false;
                document.getElementById("pay-credit-btn").disabled = false;
            } catch (err) {
                showError(err.message);
            }
        }

        async function loadAddresses() {
            try {
                const addresses = await apiFetch("/customers/addresses");
                const container = document.getElementById("address-list");
                container.innerHTML = addresses.length
                    ? addresses.map(a => `
                        <div class="bg-white border-2 ${a.is_default ? 'border-[#009640]/40' : 'border-gray-200'} rounded-xl p-4 space-y-2 cursor-pointer shadow-xs">
                            <h3 class="text-xs font-bold text-gray-900">${a.label}${a.is_default ? ' (Primary)' : ''}</h3>
                            <p class="text-[11px] text-gray-500 font-medium leading-relaxed">${a.address_text}</p>
                        </div>`).join("")
                    : `<p class="text-xs text-gray-400 col-span-2">No saved addresses yet. <a href="customer-profile.html" class="text-[#009640] underline">Add one</a>.</p>`;
            } catch (err) {
                document.getElementById("address-list").innerHTML = `<p class="text-xs text-red-500">${err.message}</p>`;
            }
        }

        async function loadPaymentConfig() {
            const config = await apiFetch("/payments/config", { auth: false });
            razorpayKeyId = config.razorpay_key_id;
            if (!config.razorpay_configured) {
                configNotice.textContent = "⚠️ Razorpay isn't configured on the backend yet — payment will be simulated instead of opening the real Razorpay window.";
                configNotice.classList.remove("hidden");
            }
        }

        payBtn.addEventListener("click", async () => {
    payBtn.disabled = true;
    payLabel.textContent = "Processing...";



    try {
        const payment = await apiFetch("/payments/create-order", { method: "POST", body: { order_id: currentOrder.id } });

        // The backend falls back to a stub order id if Razorpay auth fails server-side —
        // opening the real Razorpay widget with a fake order id always 400s, so check for
        // that explicitly instead of trusting /payments/config alone.
        const isRealRazorpayOrder = razorpayKeyId && !payment.razorpay_order_id.startsWith("order_stub_");

        if (!isRealRazorpayOrder) {
            await apiFetch("/payments/webhook", {
                method: "POST",
                auth: false,
                body: {
                    razorpay_order_id: payment.razorpay_order_id,
                    razorpay_payment_id: "pay_dev_" + Date.now(),
                    status: "captured",
                    method: "dev_simulated",
                },
            });
            alert("Payment simulated (Razorpay credentials aren't valid yet — see backend logs). Order marked as paid.");
            window.location.href = "order-status.html";
            return;
        }

        const options = {
            key: razorpayKeyId,
            amount: Math.round(payment.amount * 100),
            currency: "INR",
            name: "VyapaarSetu",
            description: `Order #${currentOrder.id}`,
            order_id: payment.razorpay_order_id,
            handler: async function (response) {
                try {
                    await apiFetch("/payments/verify", {
                        method: "POST",
                        auth: false,
                        body: {
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature,
                        },
                    });
                    alert("Payment successful!");
                    window.location.href = "order-status.html";
                } catch (err) {
                    showError("Payment verification failed: " + err.message);
                }
            },
            theme: { color: "#009640" },
        };

        const rzp = new Razorpay(options);
        rzp.open();
    } catch (err) {
        showError(err.message);
    } finally {
        payBtn.disabled = false;
        payLabel.textContent = currentOrder ? `Pay ₹${currentOrder.total_amount.toLocaleString("en-IN")}` : "Pay Now";
    }
});

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                () => { document.getElementById("location-label").textContent = "Current location"; },
                () => { document.getElementById("location-label").textContent = "Location unavailable"; }
            );
        }

        loadOrder();
        loadAddresses();
        loadPaymentConfig();
        document.getElementById("pay-credit-btn").addEventListener("click", async () => {
    if (!confirm(`Add ₹${currentOrder.total_amount.toLocaleString("en-IN")} to your credit balance with this store?`)) return;
    try {
        await apiFetch("/credit/pay-with-credit", { method: "POST", body: { order_id: currentOrder.id } });
        alert("Order placed on credit successfully!");
        window.location.href = "order-status.html";
    } catch (err) {
        showError(err.message);
    }
});
    </script>
</body>
</html>
