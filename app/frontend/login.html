<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VyapaarSetu - Merchant Hub Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-white min-h-screen flex text-gray-800 antialiased">

    <!-- Left Side: Hero Image & Glassmorphism Text -->
    <div class="hidden md:flex md:w-1/2 bg-cover bg-center relative p-12 flex-col justify-center items-center"
         style="background-image: url('https://images.unsplash.com/photo-1604719312566-8912e9227c6a?auto=format&fit=crop&q=80&w=1000');">
        <!-- Warm overlay to match the screenshot's tone -->
        <div class="absolute inset-0 bg-amber-900/10 mix-blend-multiply"></div>

        <!-- Glassmorphism Card -->
        <div class="glass-card rounded-2xl p-8 max-w-md relative z-10 text-white shadow-2xl">
            <h1 class="text-3xl font-bold mb-4 leading-tight">Empowering Local Commerce</h1>
            <p class="text-white/90 text-sm leading-relaxed">
                Join thousands of merchants managing their inventory, orders, and growth with VyapaarSetu's intelligent retail platform.
            </p>
        </div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="w-full md:w-1/2 flex flex-col justify-between p-8 md:p-12 min-h-screen bg-white">
        <!-- Spacer for top to push center content down evenly -->
        <div class="hidden md:block"></div>

        <!-- Main Form Container -->
        <div class="w-full max-w-md mx-auto flex flex-col items-center">

            <!-- Logo Icon Box -->
            <div class="bg-[#009640] text-white p-3.5 rounded-xl shadow-sm mb-4">
                <i data-lucide="store" class="w-7 h-7"></i>
            </div>

            <!-- Brand Header -->
            <h2 class="text-2xl font-bold text-[#00642d] tracking-tight">VyapaarSetu</h2>
            <p class="text-xs text-gray-500 mt-1 mb-8 font-medium">Merchant Hub Login</p>

            <form class="w-full space-y-5">
                <!-- Email Input -->
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 uppercase tracking-wider mb-1.5">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </div>
                        <input type="email" placeholder="name@store.com"
                               class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm placeholder-gray-400 focus:outline-none focus:border-[#009640] focus:ring-1 focus:ring-[#009640] transition">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-[10px] font-bold text-gray-700 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-[11px] font-bold text-[#008037] hover:underline">Forgot Password?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" placeholder="••••••••"
                               class="w-full pl-10 pr-10 py-2.5 bg-white border border-gray-300 rounded-lg text-sm placeholder-gray-400 focus:outline-none focus:border-[#009640] focus:ring-1 focus:ring-[#009640] transition">
                        <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 cursor-pointer hover:text-gray-600">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>

                <!-- Keep me signed in -->
                <div class="flex items-center">
                    <input id="keep-signed-in" type="checkbox"
                           class="h-4 w-4 text-[#009640] focus:ring-[#009640] border-gray-300 rounded">
                    <label for="keep-signed-in" class="ml-2 block text-xs text-gray-600 font-medium select-none">
                        Keep me signed in for 30 days
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="w-full bg-[#12a64a] hover:bg-[#0e8f3e] text-white font-semibold py-3 px-4 rounded-lg text-sm shadow-sm flex items-center justify-center gap-1.5 transition duration-150 ease-in-out">
                    Login to Dashboard
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="w-full flex items-center my-6">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Or Continue With</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Google OAuth Button -->
            <button type="button"
                    class="w-full flex items-center justify-center gap-2.5 border border-gray-300 rounded-lg py-2.5 bg-white text-xs font-semibold text-gray-700 hover:bg-gray-50 shadow-sm transition">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>

            <!-- Sign Up Prompt -->
            <p class="text-xs text-gray-600 font-medium mt-6">
                Don't have account? <a href="#" class="text-[#008037] font-bold hover:underline">Sign Up</a>
            </p>
        </div>

        <!-- Footer Links -->
        <div class="flex justify-center space-x-6 text-[11px] font-medium text-gray-500 mt-8">
            <a href="#" class="hover:text-gray-800 transition">Privacy Policy</a>
            <a href="#" class="hover:text-gray-800 transition">Terms of Service</a>
            <a href="#" class="hover:text-gray-800 transition">Help Center</a>
        </div>
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
